[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admet-uq"
version = "1.0.0"
description = "Code for uncertainty quantification experiments on the TDC ADMET datasets."
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  "numpy",
  "pandas",
  "scipy>=1.10",
  "scikit-learn",
  "rdkit==2026.3.4",
  "chembl_structure_pipeline==1.2.4",
  "descriptastorus==2.8.0",
  "lightgbm",
  "pyarrow",
  "tyro",
]

[project.optional-dependencies]
dev = ["pytest"]
neural-cpu = [
  "jax==0.11.0",
  "jaxlib==0.11.0",
  "optax==0.2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admet_uq"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
